<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商業計劃自測表 · AI 簡答版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c0a; --surface:rgba(16,34,28,0.55); --surface2:rgba(20,40,34,0.45);
  --border:rgba(255,255,255,0.06); --edge:rgba(255,255,255,0.04);
  --white:#e8f2ec; --light:#b8ccc2; --muted:#6e8e7c;
  --accent:#2dd4a8; --accent2:#1a9e7a; --accent-glow:rgba(45,212,168,0.18);
  --warn:#f0984a; --warn-glow:rgba(240,152,74,0.18);
  --danger:#e0556a;
  --radius:16px; --radius-sm:10px;
  --font:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;
}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--font); background:var(--bg); color:var(--white);
  min-height:100vh; line-height:1.7; -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
}
body::before{
  content:''; position:fixed; top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(45,212,168,0.06) 0%, transparent 60%),
             radial-gradient(ellipse at 80% 60%, rgba(240,152,74,0.04) 0%, transparent 50%),
             radial-gradient(ellipse at 20% 80%, rgba(45,212,168,0.04) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}
.page{display:none;position:relative;z-index:1;width:100%;max-width:640px;flex:1}
.page.active{display:flex;flex-direction:column}
.page-center{justify-content:center;align-items:center;padding:40px 20px;text-align:center}

/* ===== GLASS CARD ===== */
.glass-card{
  background:var(--surface); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 var(--edge);
  padding:40px 32px; width:100%;
  transform:translateZ(0); -webkit-transform:translateZ(0);
}
.glass-card-sm{padding:24px 20px}
@media(max-width:480px){.glass-card{padding:28px 18px}}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font);font-size:0.95rem;font-weight:600;
  padding:12px 28px;border-radius:99px;cursor:pointer;transition:all 0.25s;
  border:none;letter-spacing:0.03em;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
.btn-primary{background:var(--accent);color:#042018;box-shadow:0 4px 20px var(--accent-glow)}
.btn-primary:hover{background:#3de0b4;transform:translateY(-1px);box-shadow:0 6px 28px rgba(45,212,168,0.3)}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid rgba(45,212,168,0.3)}
.btn-secondary:hover{background:rgba(45,212,168,0.08)}
.btn-sm{padding:8px 18px;font-size:0.85rem}
.btn-ghost{background:transparent;border:none;color:var(--muted);cursor:pointer;font-family:var(--font);font-size:0.9rem;padding:6px 12px;transition:color 0.2s}
.btn-ghost:hover{color:var(--accent)}
.btn-warn{background:var(--warn);color:#1a0e04;box-shadow:0 4px 20px var(--warn-glow)}

/* ===== WELCOME PAGE ===== */
.welcome-badge{
  display:inline-block;font-size:0.75rem;font-weight:500;letter-spacing:0.15em;
  color:var(--accent);border:1px solid rgba(45,212,168,0.25);
  border-radius:99px;padding:5px 14px;margin-bottom:24px;
}
.welcome-title{font-size:2rem;font-weight:700;letter-spacing:0.03em;margin-bottom:4px}
.welcome-sub{font-size:0.95rem;color:var(--muted);margin-bottom:28px}
.welcome-features{display:flex;flex-direction:column;gap:12px;margin-bottom:28px;text-align:left}
.wf-item{
  display:flex;align-items:center;gap:10px;font-size:0.88rem;color:var(--light);
  background:var(--surface2);border-radius:var(--radius-sm);padding:11px 14px;
  border:1px solid var(--border);
}
.wf-icon{font-size:1.2rem;flex-shrink:0}

/* ===== QUIZ PAGE ===== */
#page-quiz{padding-bottom:40px}
.quiz-top{
  position:sticky;top:0;z-index:10;
  background:rgba(8,12,10,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:14px 20px;
  display:flex;flex-direction:column;gap:10px;
}
.quiz-top-row{display:flex;align-items:center;justify-content:space-between}
.progress-text{font-size:0.85rem;font-weight:500;color:var(--light)}
.progress-bar-wrap{width:100%;height:3px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s ease}
.q-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.q-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.2s}
.q-dot.done{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.q-dot.current{border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow);background:rgba(45,212,168,0.15)}

.quiz-body{flex:1;padding:20px;display:flex;flex-direction:column}
.q-card{
  background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 var(--edge);
  padding:28px 24px;flex:1;display:flex;flex-direction:column;
  transition:opacity 0.25s,transform 0.25s;
}
.q-card.fading{opacity:0;transform:translateY(8px)}
.q-dim-label{font-size:0.75rem;font-weight:600;color:var(--accent);letter-spacing:0.1em;margin-bottom:12px}
.q-title{font-size:1.05rem;font-weight:600;color:var(--white);margin-bottom:6px;line-height:1.5}
.q-desc{font-size:0.88rem;color:var(--light);margin-bottom:20px;line-height:1.7}
.q-textarea{
  flex:1;min-height:140px;padding:14px 16px;border-radius:var(--radius-sm);
  background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);
  color:var(--white);font-family:var(--font);font-size:0.92rem;line-height:1.8;
  outline:none;resize:none;transition:border-color 0.2s;
}
.q-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,212,168,0.08)}
.q-textarea::placeholder{color:var(--muted)}
.q-char-count{font-size:0.75rem;color:var(--muted);text-align:right;margin-top:6px}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.q-nav-center{justify-content:center}
.q-hint{font-size:0.75rem;color:var(--muted)}

/* ===== ANALYZING PAGE ===== */
#page-analyzing{justify-content:center;align-items:center;text-align:center}
.analyze-ring{
  width:80px;height:80px;border-radius:50%;
  border:3px solid rgba(45,212,168,0.15);
  border-top-color:var(--accent);
  animation:spin 1s linear infinite;
  margin:0 auto 24px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.analyze-title{font-size:1.1rem;font-weight:600;margin-bottom:8px}
.analyze-sub{font-size:0.88rem;color:var(--muted);margin-bottom:28px}
.analyze-dots{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.analyze-dot{width:8px;height:8px;border-radius:50%;background:rgba(45,212,168,0.2);animation:pulse 1.4s ease-in-out infinite}
.analyze-dot:nth-child(2){animation-delay:0.2s}
.analyze-dot:nth-child(3){animation-delay:0.4s}
@keyframes pulse{0%,80%,100%{transform:scale(0.6);opacity:0.3}40%{transform:scale(1);opacity:1}}
.analyze-error{color:var(--danger);font-size:0.9rem;margin-bottom:16px;display:none}
.analyze-error.show{display:block}

/* ===== RESULT PAGE ===== */
#page-result{padding:32px 20px 60px}
.result-inner{width:100%}
.result-header{text-align:center;margin-bottom:24px}
.result-label{font-size:0.8rem;color:var(--muted);letter-spacing:0.12em;margin-bottom:8px}
.result-score{font-size:3rem;font-weight:700;color:var(--accent);line-height:1.1}
.result-score span{font-size:1.2rem;color:var(--muted);font-weight:400}
.result-tier{display:inline-block;font-size:0.85rem;font-weight:600;padding:4px 16px;border-radius:99px;background:var(--accent-glow);color:var(--accent);margin-top:8px}
.result-ai-tag{display:inline-block;font-size:0.72rem;padding:3px 10px;border-radius:99px;background:rgba(240,152,74,0.12);color:var(--warn);margin-top:8px;margin-left:6px}
.radar-wrap{
  background:var(--surface);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 var(--edge);
  padding:12px;display:flex;justify-content:center;margin-bottom:24px;
}
.radar-wrap canvas{max-width:100%;height:auto}

.section-title{font-size:0.85rem;font-weight:600;color:var(--muted);letter-spacing:0.08em;margin-bottom:12px;padding-left:4px}
.dim-bars{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.dim-bar-row{display:flex;align-items:center;gap:10px}
.dim-bar-label{width:68px;font-size:0.8rem;color:var(--light);text-align:right;flex-shrink:0}
.dim-bar-track{flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}
.dim-bar-fill{height:100%;border-radius:99px;transition:width 0.8s ease}
.dim-bar-fill.low{background:var(--warn);box-shadow:0 0 8px var(--warn-glow)}
.dim-bar-fill.mid{background:var(--accent);opacity:0.7}
.dim-bar-fill.high{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.dim-bar-score{width:28px;font-size:0.85rem;font-weight:600;color:var(--white);text-align:center}

.advice-section{
  background:var(--surface);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(0,0,0,0.3),inset 0 1px 0 var(--edge);
  padding:20px;margin-bottom:16px;
}
.advice-section.focus{border-color:rgba(240,152,74,0.2)}
.advice-section.strength{border-color:rgba(45,212,168,0.15)}
.advice-label{font-size:0.75rem;font-weight:600;letter-spacing:0.08em;margin-bottom:10px}
.advice-label.warn{color:var(--warn)}
.advice-label.good{color:var(--accent)}
.advice-title{font-size:0.95rem;font-weight:600;margin-bottom:10px;color:var(--white)}
.advice-text{font-size:0.88rem;color:var(--light);line-height:1.7;margin-bottom:6px}
.advice-text:last-child{margin-bottom:0}
.advice-dim-name{color:var(--accent);font-weight:500}
.result-actions{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.dim-advice-list{display:flex;flex-direction:column;gap:10px}
.dim-advice-item{padding:10px 14px;background:rgba(0,0,0,0.2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.dim-advice-item strong{color:var(--accent)}
/* Enhanced AI result cards */
.advice-card{padding:14px 18px;border-radius:var(--radius-sm);margin-bottom:10px;border:1px solid var(--border)}
.advice-card.warn-card{background:rgba(240,152,74,0.06);border-color:rgba(240,152,74,0.18)}
.advice-card.good-card{background:rgba(45,212,168,0.05);border-color:rgba(45,212,168,0.15)}
.advice-risk,.advice-leverage{font-size:0.82rem;color:var(--muted);margin-top:4px}
.advice-action{font-size:0.85rem;color:var(--light);margin-top:4px}
/* Per-dimension detail cards */
.dim-detail-card{padding:16px 18px;background:rgba(0,0,0,0.2);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px}
.dim-detail-card.low{border-left:3px solid var(--warn)}
.dim-detail-card.mid{border-left:3px solid var(--light)}
.dim-detail-card.high{border-left:3px solid var(--accent)}
.dd-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dd-dim{font-weight:700;font-size:1rem;color:var(--white)}
.dd-score{font-weight:700;font-size:1.05rem}
.dim-detail-card.low .dd-score{color:var(--warn)}
.dim-detail-card.mid .dd-score{color:var(--light)}
.dim-detail-card.high .dd-score{color:var(--accent)}
.dd-analysis,.dd-weakness,.dd-advice,.dd-milestone{font-size:0.82rem;line-height:1.6;margin-top:5px}
.dd-analysis{color:var(--light)}
.dd-weakness{color:var(--warn);opacity:0.85}
.dd-advice{color:var(--accent);opacity:0.9}
.dd-milestone{color:var(--muted)}
.roadmap{background:rgba(45,212,168,0.04);border-color:rgba(45,212,168,0.15)}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .welcome-title{font-size:1.6rem}
  .quiz-top{padding:10px 12px}
  .quiz-body{padding:14px 12px}
  .q-card{padding:20px 16px}
  .q-title{font-size:0.95rem}
  .q-textarea{min-height:120px;font-size:0.88rem}
  .result-score{font-size:2.4rem}
  .dim-bar-label{width:56px;font-size:0.75rem}
}
</style>
</head>
<body>

<!-- ==================== WELCOME PAGE ==================== -->
<div class="page active page-center" id="page-welcome">
  <div class="glass-card">
    <div class="welcome-badge">商業工具 · AI 診斷版</div>
    <h1 class="welcome-title">商業計劃<br>自測表</h1>
    <p class="welcome-sub">12 道簡答題 · AI 深度分析 · 個人化建議</p>
    <div class="welcome-features">
      <div class="wf-item"><span class="wf-icon">✍️</span>12 道開放式簡答題，寫出你真實的商業現狀</div>
      <div class="wf-item"><span class="wf-icon">🤖</span>AI 逐題分析，自動生成 12 維度評分與雷達圖</div>
      <div class="wf-item"><span class="wf-icon">🎯</span>針對你的具體情況，產出個人化改善建議</div>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">開始測評 →</button>
    <button class="btn btn-secondary btn-sm" onclick="startAutoFill()" style="margin-top:12px">⚡ 自動填充示範答案（每題15秒）</button>
    <p style="font-size:0.8rem;color:var(--muted);margin-top:14px">內建 AI 分析 · 無需設定即可使用</p>
  </div>
</div>

</div>

<!-- ==================== QUIZ PAGE ==================== -->
<div class="page" id="page-quiz">
  <div class="quiz-top">
    <div class="quiz-top-row">
      <button class="btn-ghost" onclick="confirmLeave()">← 返回</button>
      <span class="progress-text" id="progress-text">第 1/12 題</span>
      <button class="btn btn-sm btn-ghost" id="btn-autofill-cancel" style="display:none;color:var(--warn)" onclick="stopAutoFill()">⏹ 停止自動填充</button>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
    <div class="q-dots" id="q-dots"></div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
</div>

<!-- ==================== ANALYZING PAGE ==================== -->
<div class="page page-center" id="page-analyzing">
  <div class="glass-card glass-card-sm">
    <div class="analyze-ring"></div>
    <div class="analyze-title">AI 正在分析你的商業計劃…</div>
    <div class="analyze-sub">正在綜合評估 12 個維度，約需 10-20 秒</div>
    <div class="analyze-dots"><span class="analyze-dot"></span><span class="analyze-dot"></span><span class="analyze-dot"></span></div>
    <div class="analyze-error" id="analyze-error"></div>
    <div id="analyze-actions" style="display:none">
      <button class="btn btn-sm btn-primary" onclick="retryAnalysis()">重新分析</button>
      <button class="btn btn-sm btn-secondary" style="margin-left:8px" onclick="fallbackAnalysis()">使用離線模式</button>
    </div>
  </div>
</div>

<!-- ==================== RESULT PAGE ==================== -->
<div class="page" id="page-result">
  <div class="result-inner" id="result-inner"></div>
</div>

<script>
// ==================== DATA ====================
const DIMENSIONS = [
  { id:'d1',  name:'客戶定位', short:'客戶' },
  { id:'d2',  name:'價值主張', short:'價值' },
  { id:'d3',  name:'流量獲客', short:'流量' },
  { id:'d4',  name:'成交轉化', short:'轉化' },
  { id:'d5',  name:'交付體驗', short:'交付' },
  { id:'d6',  name:'客戶維繫', short:'維繫' },
  { id:'d7',  name:'收入設計', short:'收入' },
  { id:'d8',  name:'成本結構', short:'成本' },
  { id:'d9',  name:'核心資源', short:'資源' },
  { id:'d10', name:'關鍵動作', short:'動作' },
  { id:'d11', name:'合作槓桿', short:'合作' },
  { id:'d12', name:'數據迭代', short:'數據' }
];

const QUESTIONS = [
  { dim:'客戶定位', text:'請描述你的目標客戶是誰——他們的年齡、職業、收入水平、消費習慣、活躍在哪些平台？越具體越好。' },
  { dim:'價值主張', text:'你的產品或服務幫客戶解決了什麼痛點？客戶有多着急解決這個問題？他們現在是用什麼替代方案在應付？' },
  { dim:'流量獲客', text:'你目前通過什麼渠道獲取客戶？線上還是線下為主？這些渠道是否穩定可複製？你清楚獲客成本嗎？' },
  { dim:'成交轉化', text:'從客戶第一次接觸你到最終付款，中間經歷了哪些步驟？哪個環節最容易流失客戶？你的成交轉化率大概是多少？' },
  { dim:'交付體驗', text:'客戶付款後，你的產品或服務如何送達他們手中？這個過程是否標準化？客戶满意度如何？你有收集反饋嗎？' },
  { dim:'客戶維繫', text:'客戶買完一次後還會再買嗎？你有沒有主動維繫客戶的動作（社群、回訪、內容觸達）？客戶會推薦你給別人嗎？' },
  { dim:'收入設計', text:'你的定價邏輯是什麼？是否有不同檔次的產品？收入結構是單次買賣還是包含訂閱／續費？利潤率如何？' },
  { dim:'成本結構', text:'你的固定成本和可變成本分別是什麼？你清楚每賣出一單的利潤嗎？盈虧平衡點在哪裡？' },
  { dim:'核心資源', text:'你生意中最不可替代的核心資源是什麼？是人、技術、供應鏈、客戶關係、還是數字資產（如社群／內容庫／數據）？' },
  { dim:'關鍵動作', text:'你每天／每週最重要的 3 件事是什麼？你的時間主要花在哪些事情上？這些事情對生意增長的貢獻有多大？' },
  { dim:'合作槓桿', text:'你現在有哪些外部合作夥伴？哪些環節你考慮外包或合作而非自己做？你有利用線上平台或工具來放大能力嗎？' },
  { dim:'數據迭代', text:'你用什麼指標來判斷生意的好壞？你多久看一次數據？上一次因為數據的提示而改變一個重要決策是什麼時候？' }
];

// Keep old advice pool for fallback
const ADVICE_FALLBACK = [
  // Per-dimension advice (3 tiers each) - abbreviated for fallback

let answers = {};          // { 'q0': 'answer text', ... }
let currentQ = 0;          // 0-11
let dimScores = [];
let aiResult = null;
let isFallback = false;

// ==================== PAGE SWITCHING ====================
function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById('page-' + id);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
}

// ==================== QUIZ ====================
function startQuiz() {
  answers = {}; currentQ = 0; dimScores = []; aiResult = null; isFallback = false;
  switchPage('quiz');
  buildQuizUI();
  renderCurrentQuestion();
}

function confirmLeave() {
  const hasAnswers = Object.values(answers).some(a => a && a.trim());
  if (hasAnswers && !confirm('返回首頁將清除所有答題進度，確定要返回嗎？')) return;
  switchPage('welcome');
}

function buildQuizUI() {
  const dots = document.getElementById('q-dots');
  dots.innerHTML = Array.from({length:12}, (_,i) =>
    `<div class="q-dot" id="qdot-${i}" onclick="jumpTo(${i})" title="第${i+1}題"></div>`
  ).join('');
}

function renderCurrentQuestion() {
  const q = QUESTIONS[currentQ];
  const prevAns = answers['q'+currentQ] || '';
  const answered = Object.values(answers).filter(a => a && a.trim()).length;

  // Update progress
  document.getElementById('progress-text').textContent = `第 ${currentQ+1}/12 題`;
  document.getElementById('progress-bar').style.width = (answered / 12 * 100) + '%';

  // Update dots
  for (let i = 0; i < 12; i++) {
    const dot = document.getElementById('qdot-'+i);
    if (dot) {
      dot.classList.remove('done','current');
      if (answers['q'+i] && answers['q'+i].trim()) dot.classList.add('done');
      if (i === currentQ) dot.classList.add('current');
    }
  }

  // Render question card (textarea value set separately to avoid escaping issues)
  const container = document.getElementById('quiz-body');
  container.innerHTML = `
    <div class="q-card" id="q-card">
      <div class="q-dim-label">維度 ${String(currentQ+1).padStart(2,'0')} · ${q.dim}</div>
      <div class="q-title">${q.text}</div>
      <textarea class="q-textarea" id="q-input" placeholder="在此輸入你的回答…（愈具體愈好，AI 能給出更精準的分析）"
        onkeydown="handleKeydown(event)"></textarea>
      <div class="q-char-count"><span id="char-count">${prevAns.length}</span> 字</div>
      <div class="q-nav ${currentQ === 11 ? 'q-nav-center' : ''}">
        ${currentQ > 0
          ? '<button class="btn btn-secondary btn-sm" onclick="prevQuestion()">← 上一題</button>'
          : '<span></span>'}
        ${currentQ < 11
          ? '<button class="btn btn-primary btn-sm" id="btn-next" onclick="nextQuestion()">下一題 →</button>'
          : '<button class="btn btn-primary" id="btn-submit" onclick="submitAll()">✓ 提交分析</button>'}
      </div>
      <p class="q-hint" style="margin-top:8px;text-align:center">Shift + Enter 換行 · 直接按 Enter 跳到下一題</p>
    </div>
  `;

  // Set textarea value directly (safe from XSS and escaping issues)
  const ta = document.getElementById('q-input');
  if (ta) {
    ta.value = prevAns;
    ta.addEventListener('input', updateCharCount);
    setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 150);
  }
}

function updateCharCount() {
  const ta = document.getElementById('q-input');
  const cc = document.getElementById('char-count');
  if (ta && cc) cc.textContent = ta.value.length;
}

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (currentQ < 11) nextQuestion();
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function saveCurrentAnswer() {
  const ta = document.getElementById('q-input');
  if (ta) answers['q'+currentQ] = ta.value;
}

function nextQuestion() {
  saveCurrentAnswer();
  stopAutoFill();
  if (currentQ < 11) {
    animateTransition(() => { currentQ++; renderCurrentQuestion(); });
  }
}

function prevQuestion() {
  saveCurrentAnswer();
  stopAutoFill();
  if (currentQ > 0) {
    animateTransition(() => { currentQ--; renderCurrentQuestion(); });
  }
}

function jumpTo(idx) {
  saveCurrentAnswer();
  stopAutoFill();
  if (idx !== currentQ) {
    currentQ = idx;
    renderCurrentQuestion();
    document.getElementById('q-card').scrollIntoView({behavior:'smooth',block:'center'});
  }
}

function animateTransition(fn) {
  const card = document.getElementById('q-card');
  if (card) { card.classList.add('fading'); }
  setTimeout(() => {
    fn();
    setTimeout(() => {
      const newCard = document.getElementById('q-card');
      if (newCard) newCard.classList.remove('fading');
    }, 50);
  }, 200);
}

let autoFillTimer = null;

function startAutoFill() {
  // If not in quiz, start it first
  if (!document.getElementById('page-quiz').classList.contains('active')) {
    startQuiz();
    // Wait for DOM to settle, then begin from Q0
    setTimeout(() => autoFillStep(0), 400);
  } else {
    autoFillStep(currentQ);
  }
  // Show cancel button
  const btn = document.getElementById('btn-autofill-cancel');
  if (btn) btn.style.display = 'inline-flex';
}

function autoFillStep(idx) {
  if (idx >= 12) {
    stopAutoFill();
    return;
  }

  // Jump to this question
  saveCurrentAnswer();
  currentQ = idx;
  renderCurrentQuestion();

  // Wait for DOM render, then fill the textarea
  setTimeout(() => {
    answers['q' + idx] = DEMO_ANSWERS[idx];
    const ta = document.getElementById('q-input');
    if (ta) {
      ta.value = DEMO_ANSWERS[idx];
      updateCharCount();
    }
    // Update progress bar and dots
    const answered = Object.values(answers).filter(a => a && a.trim()).length;
    const bar = document.getElementById('progress-bar');
    if (bar) bar.style.width = (answered / 12 * 100) + '%';
    for (let i = 0; i < 12; i++) {
      const dot = document.getElementById('qdot-' + i);
      if (dot) {
        dot.classList.remove('done', 'current');
        if (answers['q' + i] && answers['q' + i].trim()) dot.classList.add('done');
        if (i === currentQ) dot.classList.add('current');
      }
    }
  }, 200);

  // If not the last question, schedule next
  if (idx < 11) {
    autoFillTimer = setTimeout(() => autoFillStep(idx + 1), 15000);
  } else {
    // Last question filled — stop, don't submit
    autoFillTimer = setTimeout(() => stopAutoFill(), 15000);
  }
}

function stopAutoFill() {
  if (autoFillTimer) { clearTimeout(autoFillTimer); autoFillTimer = null; }
  const btn = document.getElementById('btn-autofill-cancel');
  if (btn) btn.style.display = 'none';
}

// ==================== SUBMIT & ANALYZE ====================
async function submitAll() {
  saveCurrentAnswer();
  const allAnswered = QUESTIONS.every((_, i) => answers["q"+i] && answers["q"+i].trim());
  if (!allAnswered) {
    const missing = QUESTIONS.findIndex((_, i) => !answers["q"+i] || !answers["q"+i].trim());
    if (missing >= 0) {
      currentQ = missing;
      renderCurrentQuestion();
      alert("請先完成第 " + (missing+1) + " 題的回答。");
      return;
    }
    return;
  }

  switchPage("analyzing");
  document.getElementById("analyze-error").classList.remove("show");
  document.getElementById("analyze-actions").style.display = "none";
  analysisInFlight = true;

  try {
    let result = await callBuiltInAI();
    analysisInFlight = false;
    aiResult = result;
    isFallback = false;
    dimScores = result.scores.map(s => s.score);
    buildResultPage();
    switchPage('result');
    setTimeout(drawRadarChart, 300);
  } catch (err) {
    analysisInFlight = false;
    console.error('API error:', err);
    const errEl = document.getElementById('analyze-error');
    errEl.textContent = 'AI 分析失敗：' + (err.message || '未知錯誤');
    errEl.classList.add('show');
    document.getElementById('analyze-actions').style.display = 'block';
  }
}

  document.getElementById("analyze-error").classList.remove("show");

  analysisInFlight = true;

  try {
    let result = await callBuiltInAI();
    analysisInFlight = false;
    aiResult = result;
    isFallback = false;
    dimScores = result.scores.map(s => s.score);
    buildResultPage();
    switchPage('result');
    setTimeout(drawRadarChart, 300);
  } catch (err) {
    analysisInFlight = false;
    const errEl = document.getElementById('analyze-error');
    errEl.textContent = '重試仍然失敗：' + (err.message || '未知錯誤') + ' · 建議使用離線模式';
    errEl.classList.add('show');
    document.getElementById('analyze-actions').style.display = 'block';
  }
}

// ==================== 內建 AI（透過 Worker /analyze 端點，無需用戶 Key） ====================
async function callBuiltInAI() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 90000);

  // Build answers array
  const ansArray = [];
  for (let i = 0; i < 12; i++) {
    ansArray.push(answers['q'+i] || '');
  }

  // Try Worker endpoints in order
  const workerURLs = [];
  const customURL = localStorage.getItem('bizcheck_api_url');
  if (customURL) workerURLs.push(customURL.replace(/\/+$/, ''));
  workerURLs.push('https://bizcheck-ai.zdxilk.workers.dev');
  workerURLs.push('http://localhost:8765');

  let lastError = null;
  for (const baseURL of workerURLs) {
    try {
      const resp = await fetch(baseURL + '/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: ansArray }),
        signal: controller.signal
      });
      clearTimeout(timeout);

      if (!resp.ok) {
        const errBody = await resp.text().catch(() => '');
        throw new Error(`Worker 錯誤 (${resp.status})：${errBody.slice(0,100)}`);
      }

      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      if (!data.scores || data.scores.length !== 12) throw new Error('AI 回傳的評分數據不完整');
      return data;
    } catch (e) {
      lastError = e;
      if (e.name === 'AbortError') throw new Error('請求超時，請稍後再試');
      continue; // 嘗試下一個端點
    }
  }

  clearTimeout(timeout);
  throw lastError || new Error('無法連接內建 AI 服務');
}

function fallbackAnalysis() {
  analysisInFlight = false;
  isFallback = true;
  aiResult = null;

  // Keyword-based scoring
  dimScores = [];
  const positiveKw = ['系統','數據','持續','標準','流程','明確','清晰','穩定','複購','推薦','社群','自動','工具','指標','測試','優化','SOP','ROI','利潤','定價','分層','訂閱'];
  const negativeKw = ['不知道','不清楚','沒有','很少','偶爾','不穩定','混亂','模糊','摸索','差不多','大概'];

  for (let i = 0; i < 12; i++) {
    const ans = (answers['q'+i] || '').toLowerCase();
    let score = 0;
    let posHits = 0, negHits = 0;
    for (const kw of positiveKw) { if (ans.includes(kw)) posHits++; }
    for (const kw of negativeKw) { if (ans.includes(kw)) negHits++; }
    // Score based on answer length and keyword analysis
    const lenScore = Math.min(ans.length / 80, 3);
    const kwScore = Math.max(0, 2 + posHits * 0.3 - negHits * 0.5);
    score = Math.max(1, Math.min(5, Math.round((lenScore + kwScore) / 2 * 2) / 2));
    dimScores.push(score);
  }

  buildResultPage();
  switchPage('result');
  setTimeout(drawRadarChart, 300);
}

// ==================== RESULT PAGE ====================
function buildResultPage() {
  const total = dimScores.reduce((a,b) => a+b, 0);
  const avg = total / 12;

  let tierName, overallAdvice, bottom2Advice, top2Advice, balanceNote, perDimAdvice;

  if (isFallback || !aiResult) {
    // Fallback mode
    if (avg < 3) tierName = TIER_NAMES[0];
    else if (avg < 4) tierName = TIER_NAMES[1];
    else if (avg < 4.75) tierName = TIER_NAMES[2];
    else tierName = TIER_NAMES[3];

    const oaTier = avg<3?0:avg<4?1:avg<4.75?2:3;
    overallAdvice = OVERALL_FALLBACK[oaTier];

    const indexed = dimScores.map((s,i)=>({dim:i,score:s}));
    indexed.sort((a,b)=>a.score-b.score);
    const b2 = [indexed[0], indexed[1]];
    const t2 = [indexed[11], indexed[10]];

    perDimAdvice = dimScores.map((s,i)=>{
      const tier = s<=2?0:s<=3?1:2;
      const keys = ['low','mid','high'];
      return ADVICE_FALLBACK[i] ? ADVICE_FALLBACK[i][keys[tier]] : '';
    });

    bottom2Advice = b2.map(b=>({
      dim: DIMENSIONS[b.dim].name,
      advice: ADVICE_FALLBACK[b.dim] ? ADVICE_FALLBACK[b.dim]['low'] : '需要重點改善。'
    }));

    top2Advice = t2.map(t=>({
      dim: DIMENSIONS[t.dim].name,
      advice: ADVICE_FALLBACK[t.dim] ? ADVICE_FALLBACK[t.dim]['high'] : '繼續保持並放大。'
    }));

    if (t2[0].score - b2[0].score >= 3) {
      balanceNote = '你的優勢和短板差距明顯，這是一種「長板驅動型」生意模式——確保你的長板足夠長到客戶願意容忍你的短板。';
    } else if (t2[0].score - b2[0].score <= 1) {
      balanceNote = '你的各維度比較均衡，沒有明顯的短板也沒有突出的長板。建議選擇一個維度集中突破，做出一個「標誌性優勢」。';
    } else {
      balanceNote = '各維度分布合理，持續在現有基礎上精進即可。';
    }
  } else {
    // AI mode — extract rich fields from enhanced prompt
    tierName = aiResult.overallTier || TIER_NAMES[0];
    overallAdvice = aiResult.overallAdvice || '';
    bottom2Advice = aiResult.bottom2 || [];
    top2Advice = aiResult.top2 || [];
    balanceNote = aiResult.balanceNote || '';
    perDimAdvice = aiResult.scores.map(s => ({
      analysis: s.analysis || '',
      weakness: s.weakness || '',
      advice: s.advice || '',
      milestone: s.milestone || ''
    }));
    // stage roadmap (new field, may be missing)
    window._stageRoadmap = aiResult.stageRoadmap || '';
  }

  // Store for potential reuse
  window._resultData = { total, avg, tierName, overallAdvice, bottom2Advice, top2Advice, balanceNote, perDimAdvice };

  // Build dimension score bars (compact)
  const barsHTML = dimScores.map((s,i) => {
    const pct = s / 5 * 100;
    const cls = s < 3 ? 'low' : s < 4 ? 'mid' : 'high';
    return `<div class="dim-bar-row">
      <span class="dim-bar-label">${DIMENSIONS[i].name}</span>
      <div class="dim-bar-track"><div class="dim-bar-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="dim-bar-score">${s.toFixed(1)}</span>
    </div>`;
  }).join('');

  // Build bottom2 HTML (enhanced AI or simple fallback)
  let b2HTML = '';
  if (Array.isArray(bottom2Advice) && bottom2Advice.length > 0) {
    b2HTML = bottom2Advice.map(b => {
      if (b.risk && b.action) {
        // AI enhanced format
        return `<div class="advice-card warn-card">
          <div class="advice-dim-name">⚠ ${b.dim}</div>
          <div class="advice-risk">不改善的後果：${b.risk}</div>
          <div class="advice-action">建議行動：${b.action}</div>
        </div>`;
      }
      return `<p class="advice-text"><span class="advice-dim-name">${b.dim}</span>：${b.advice || ''}</p>`;
    }).join('');
  }

  // Build top2 HTML (enhanced AI or simple fallback)
  let t2HTML = '';
  if (Array.isArray(top2Advice) && top2Advice.length > 0) {
    t2HTML = top2Advice.map(t => {
      if (t.leverage && t.amplify) {
        return `<div class="advice-card good-card">
          <div class="advice-dim-name">★ ${t.dim}</div>
          <div class="advice-leverage">為什麼是槓桿：${t.leverage}</div>
          <div class="advice-action">如何放大：${t.amplify}</div>
        </div>`;
      }
      return `<p class="advice-text"><span class="advice-dim-name">${t.dim}</span>：${t.advice || ''}</p>`;
    }).join('');
  }

  // Build per-dimension detailed cards (AI mode) or simple list (fallback)
  let dimDetailHTML = '';
  if (isFallback || !aiResult) {
    dimDetailHTML = perDimAdvice.map((adv, i) => {
      const s = dimScores[i];
      return `<div class="dim-advice-item">
        <strong>${DIMENSIONS[i].name}</strong>（${s.toFixed(1)} 分）<br>
        <span style="color:var(--light)">${typeof adv === 'string' ? adv : (adv.advice || '')}</span>
      </div>`;
    }).join('');
  } else {
    dimDetailHTML = perDimAdvice.map((adv, i) => {
      const s = dimScores[i];
      const cls = s < 3 ? 'low' : s < 4 ? 'mid' : 'high';
      return `<div class="dim-detail-card ${cls}">
        <div class="dd-header">
          <span class="dd-dim">${DIMENSIONS[i].name}</span>
          <span class="dd-score">${s.toFixed(1)} 分</span>
        </div>
        <div class="dd-analysis">📊 ${adv.analysis || '暫無分析'}</div>
        <div class="dd-weakness">⚠ 關鍵問題：${adv.weakness || '暫無'}</div>
        <div class="dd-advice">💡 改善建議：${adv.advice || '暫無'}</div>
        <div class="dd-milestone">🎯 下一步里程碑：${adv.milestone || '暫無'}</div>
      </div>`;
    }).join('');
  }

  // Stage roadmap section (AI mode only)
  const roadmapHTML = (!isFallback && window._stageRoadmap) ? `
    <div class="advice-section roadmap">
      <div class="advice-label good">🗺 階段路線圖</div>
      <div class="advice-text" style="white-space:pre-line">${window._stageRoadmap}</div>
    </div>
  ` : '';

  document.getElementById('result-inner').innerHTML = `
    <div class="result-header">
      <div class="result-label">你的商業健康度</div>
      <div class="result-score">${total.toFixed(0)}<span> / 60</span></div>
      <div class="result-tier">${tierName}</div>
      ${isFallback ? '<div class="result-ai-tag">⚡ 離線模式 · 基於關鍵詞分析</div>' : '<div class="result-ai-tag">🤖 AI 深度分析 · 基於商業畫布與里程碑框架</div>'}
    </div>

    <div class="radar-wrap">
      <canvas id="radar-canvas"></canvas>
    </div>

    <div class="section-title">分維度得分</div>
    <div class="dim-bars">${barsHTML}</div>

    <div class="advice-section focus">
      <div class="advice-label warn">⚡ 優先關注區</div>
      ${b2HTML}
    </div>

    <div class="advice-section strength">
      <div class="advice-label good">★ 你的優勢區</div>
      ${t2HTML}
    </div>

    ${balanceNote ? `
    <div class="advice-section">
      <div class="advice-text">💡 ${balanceNote}</div>
    </div>` : ''}

    <div class="advice-section">
      <div class="advice-label good">綜合診斷</div>
      <div class="advice-text" style="white-space:pre-line;line-height:1.8">${overallAdvice}</div>
    </div>

    ${roadmapHTML}

    <div class="advice-section">
      <div class="advice-label good">各維度深度分析</div>
      <div class="dim-advice-list">${dimDetailHTML}</div>
    </div>

    <div class="result-actions">
      <button class="btn btn-secondary" onclick="resetAndRestart()">重新測評</button>
    </div>
  `;
}

// ==================== RADAR CHART ====================
function drawRadarChart() {
  const canvas = document.getElementById('radar-canvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const size = 600;
  const cssSize = Math.min(size, (window.innerWidth || 600) - 40);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cx = size/2, cy = size/2, R = 210, n = 12;
  const scoreR = s => (R/5) * Math.max(0.3, s);

  // Background polygons
  for (let lv = 1; lv <= 5; lv++) {
    const r = (R/5) * lv;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI/2 + (2*Math.PI/n)*i;
      const x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = lv===5?'rgba(255,255,255,0.12)':'rgba(255,255,255,0.05)';
    ctx.lineWidth = lv===3?1.2:0.8;
    ctx.setLineDash(lv===3?[4,6]:[]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Axes
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (2*Math.PI/n)*i;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a), cy+R*Math.sin(a));
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=0.7; ctx.stroke();
  }

  // Data polygon
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (2*Math.PI/n)*i;
    const r = scoreR(dimScores[i]);
    const x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();

  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  grad.addColorStop(0,'rgba(45,212,168,0.35)');
  grad.addColorStop(0.6,'rgba(45,212,168,0.08)');
  grad.addColorStop(1,'rgba(45,212,168,0.01)');
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='#2dd4a8'; ctx.lineWidth=2.2;
  ctx.shadowColor='rgba(45,212,168,0.4)'; ctx.shadowBlur=12; ctx.stroke();
  ctx.shadowBlur=0;

  // Points
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (2*Math.PI/n)*i;
    const r = scoreR(dimScores[i]);
    const x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
    ctx.beginPath(); ctx.arc(x,y,5.5,0,Math.PI*2); ctx.fillStyle='#2dd4a8'; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fillStyle='#042018'; ctx.fill();
  }

  // Labels
  ctx.fillStyle='#b8ccc2'; ctx.font='13px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (let i = 0; i < n; i++) {
    const a = -Math.PI/2 + (2*Math.PI/n)*i;
    const lr = R+30, lx = cx+lr*Math.cos(a), ly = cy+lr*Math.sin(a);
    ctx.fillText(DIMENSIONS[i].short,lx,ly);
  }

  // Center score
  const total = dimScores.reduce((a,b)=>a+b,0);
  ctx.fillStyle='#e8f2ec'; ctx.font='bold 34px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
  ctx.fillText(total.toFixed(0),cx,cy-8);
  ctx.font='13px "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
  ctx.fillStyle='#6e8e7c'; ctx.fillText('/ 60 分',cx,cy+22);
}

function resetAndRestart() {
  answers = {}; currentQ = 0; dimScores = []; aiResult = null; isFallback = false;
  switchPage('welcome');
}
